# docker-compose.yml — пример того, как вписать платформу рядом с уже имеющимися
# ollama + open-webui. Адаптируйте под ваши реальные имена сервисов/портов.

services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    depends_on:
      - ollama
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    ports:
      - "3000:8080"

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=aml_platform
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password   # см. .env.example / Docker secrets
      - POSTGRES_DB=aml_platform
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"   # можно убрать, если не нужен доступ с хоста напрямую

  aml-platform:
    build: .                # Dockerfile в корне проекта (common/ + evm_adapter/ + agent/)
    depends_on:
      - ollama
      - postgres
    env_file:
      - .env                # <-- все API-ключи и OLLAMA_HOST подтягиваются отсюда
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=aml_platform
      - POSTGRES_DB=aml_platform
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ./cache_data:/app/cache_data   # чтобы cache.db (SQLite) не терялся между рестартами

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt

volumes:
  ollama_data:
  postgres_data:
