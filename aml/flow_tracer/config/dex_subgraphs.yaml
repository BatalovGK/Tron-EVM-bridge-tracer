# flow_tracer/config/dex_subgraphs.yaml
#
# chain_id -> {protocol_key: subgraph_id} для запросов через TheGraph decentralized
# network (gateway.thegraph.com/api/<API_KEY>/subgraphs/id/<subgraph_id>).
#
# ВАЖНО: subgraph_id НЕ угадывается и не хардкодится по памяти — одна перепутанная
# строка молча вернёт данные не того пула/сети, а это форензик-платформа, где
# такая ошибка может стоить неверного вывода в отчёте комплаенс-офицеру.
#
# Откуда брать реальный subgraph_id:
#   1. https://thegraph.com/explorer -> найти нужный протокол+сеть
#   2. Открыть страницу подграфа -> кнопка "Query" -> скопировать ID из URL
#      вида https://gateway.thegraph.com/api/<key>/subgraphs/id/<ЭТО>
#   3. Свериться с официальной документацией протокола (напр. docs.uniswap.org/api/subgraph/overview),
#      что это актуальный, поддерживаемый деплой, а не заброшенный community-форк.
#
# protocol_key должен совпадать с ключом swap_query_template в dex_contracts.yaml
# (там же указано, какой GraphQL-запрос использовать для этого протокола).
#
# Помечено "ПРОВЕРЕНО" — сверено вручную по официальной странице на момент записи
# (см. дату). Остальное — ЗАПОЛНИТЬ_ВРУЧНУЮ, трейсер должен явно падать/пропускать
# резолв свопа для сети+протокола без заполненного ID, а не тихо использовать
# заглушку.

1:  # Ethereum Mainnet
  uniswap_v3: "5zvR82QoaXYFyDEKLZ9t6v9adgnptxYpKpSbxtgVENFV"  # ПРОВЕРЕНО 2026-07-20 (docs.uniswap.org/api/subgraph/overview)
  uniswap_v2: "A3Np3RQbaBA6oKJgiwDJeo5T3zrYfGHPWFYayMwtNDum"  # ПРОВЕРЕНО 2026-07-20 (docs.uniswap.org/api/subgraph/overview)

